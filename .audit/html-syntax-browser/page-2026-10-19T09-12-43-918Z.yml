- main [ref=e2]:
  - heading "有効なユーザーの名前だけを取り出す" [level=1] [ref=e3]
  - paragraph [ref=e4]:
    - text: 3人のユーザーから、
    - strong [ref=e5]: active が true の人だけ
    - text: を残し、
    - strong [ref=e6]: name だけ
    - text: を取り出します。下の4つは、同じ処理を言語ごとに書いたものです。
  - figure "①でボブを外し、②で残ったユーザーから名前を読みます。どのコードも、この順序の結果を作ります。" [ref=e7]:
    - img "3人から有効な2人の名前を取り出す流れ 入力はアキが有効、ボブが無効、メイが有効。有効なユーザーを選び、名前だけを取り出すと、アキとメイになる。" [ref=e8]:
      - generic [ref=e10]: 入力：users
      - generic [ref=e11]: "アキ active: true"
      - generic [ref=e12]: "ボブ active: false"
      - generic [ref=e13]: "メイ active: true"
      - generic [ref=e16]: ① 有効な人を選ぶ
      - generic [ref=e17]: アキ・メイ
      - generic [ref=e20]: ② 名前だけ取り出す
      - generic [ref=e21]: "[\"アキ\", \"メイ\"]"
