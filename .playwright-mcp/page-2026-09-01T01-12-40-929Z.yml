            - heading "How ChatGPT and Codex use skills Copy link to __codexlocalizedvalueprops__codextranslations u0018 how chatgpt and codex use skills" [level=2] [ref=e353]:
              - generic [ref=e354]: How ChatGPT and Codex use skills
              - button "Copy link to __codexlocalizedvalueprops__codextranslations u0018 how chatgpt and codex use skills" [ref=e355] [cursor=pointer]
            - paragraph [ref=e358]: "ChatGPT and Codex can activate skills in two ways:"
            - list [ref=e359]:
              - listitem [ref=e360]:
                - strong [ref=e361]: "Explicit invocation:"
                - text: Include the skill directly in your prompt. In ChatGPT, type
                - code [ref=e362]: "@"
                - text: to select a skill. In Codex CLI or the IDE extension, run
                - code [ref=e363]: /skills
                - text: or type
                - code [ref=e364]: $
                - text: to mention a skill.
              - listitem [ref=e365]:
                - strong [ref=e366]: "Implicit invocation:"
                - text: ChatGPT or Codex can choose a skill when your task matches the skill
                - code [ref=e367]: description
                - text: .
            - paragraph [ref=e368]:
              - text: Because implicit matching depends on
              - code [ref=e369]: description
              - text: ", write concise descriptions with clear scope and boundaries. Front-load the key use case and trigger words so a host can still match the skill if descriptions are shortened."
            - heading "Create a skill Copy link to __codexlocalizedvalueprops__codextranslations u0023 create a skill" [level=2] [ref=e370]:
              - generic [ref=e371]: Create a skill
              - button "Copy link to __codexlocalizedvalueprops__codextranslations u0023 create a skill" [ref=e372] [cursor=pointer]
            - paragraph [ref=e375]:
              - text: If you already know the workflow and it's easier to show than describe, use
              - link "Record & Replay" [ref=e376] [cursor=pointer]:
                - /url: /docs/extend/record-and-replay
              - text: . The recorder captures the workflow, inspects the steps, and drafts a reusable skill from the demonstration.
            - paragraph [ref=e377]:
              - text: If you want to describe the skill instead, use the built-in creator. In ChatGPT Work, invoke it as
              - code [ref=e378]: "@skill-creator"
              - text: ". In Codex, invoke it as:"
            - generic [ref=e379]:
              - code [ref=e380]:
                - generic [ref=e381]: $skill-creator
              - generic [ref=e382]:
                - button "Copy code to clipboard" [ref=e383] [cursor=pointer]
                - status [ref=e386]
            - paragraph [ref=e387]: The creator asks what the skill does, when it should trigger, and whether it should stay instruction-only or include scripts. Instruction-only is the default.
            - paragraph [ref=e388]:
              - text: You can also create a skill manually by creating a folder with a
              - code [ref=e389]: SKILL.md
              - text: "file:"
            - generic [ref=e390]:
              - code [ref=e391]:
                - generic [ref=e392]: "---"
                - generic [ref=e393]: "name: skill-name"
                - generic [ref=e394]: "description: Explain exactly when this skill should and should not trigger."
                - generic [ref=e395]: "---"
                - generic [ref=e396]: Skill instructions for ChatGPT or Codex to follow.
              - generic [ref=e397]:
                - button "Copy code to clipboard" [ref=e398] [cursor=pointer]
                - status [ref=e401]
            - paragraph [ref=e402]: Codex detects skill changes automatically. If an update doesn't appear, restart Codex.
            - heading "Where Codex loads local skills Copy link to __codexlocalizedvalueprops__codextranslations u0029 where codex loads local skills" [level=2] [ref=e403]:
              - generic [ref=e404]: Where Codex loads local skills
              - button "Copy link to __codexlocalizedvalueprops__codextranslations u0029 where codex loads local skills" [ref=e405] [cursor=pointer]
            - paragraph [ref=e408]:
              - text: Codex reads skills from repository, user, admin, and system locations. For repositories, Codex scans
              - code [ref=e409]: .agents/skills
              - text: in every directory from your current working directory up to the repository root. If two skills share the same
              - code [ref=e410]: name
              - text: ", Codex doesn't merge them; both can appear in skill selectors."
            - table [ref=e412]:
              - rowgroup [ref=e413]:
                - row [ref=e414]:
                  - columnheader "Skill Scope" [ref=e415]
                  - columnheader "Location" [ref=e416]
                  - columnheader "Suggested use" [ref=e417]
              - rowgroup [ref=e418]:
                - row [ref=e419]:
                  - cell [ref=e420]:
                    - code [ref=e421]: REPO
                  - cell [ref=e422]:
                    - code [ref=e423]: $CWD/.agents/skills
                    - text: "Current working directory: where you launch Codex."
                  - cell "If you're in a repository or code environment, teams can check in skills relevant to a working folder. For example, skills only relevant to a microservice or a module." [ref=e424]
                - row [ref=e425]:
                  - cell [ref=e426]:
                    - code [ref=e427]: REPO
                  - cell [ref=e428]:
                    - code [ref=e429]: $CWD/../.agents/skills
                    - text: A folder above CWD when you launch Codex inside a Git repository.
                  - cell "If you're in a repository with nested folders, organizations can check in skills relevant to a shared area in a parent folder." [ref=e430]
                - row [ref=e431]:
                  - cell [ref=e432]:
                    - code [ref=e433]: REPO
                  - cell [ref=e434]:
                    - code [ref=e435]: $REPO_ROOT/.agents/skills
                    - text: The topmost root folder when you launch Codex inside a Git repository.
                  - cell "If you're in a repository with nested folders, organizations can check in skills relevant to everyone using the repository. These serve as root skills available to any subfolder in the repository." [ref=e436]
                - row [ref=e437]:
                  - cell [ref=e438]:
                    - code [ref=e439]: USER
                  - cell [ref=e440]:
                    - code [ref=e441]: $HOME/.agents/skills
                    - text: Any skills checked into the user's personal folder.
                  - cell "Use to curate skills relevant to a user that apply to any repository the user may work in." [ref=e442]
                - row [ref=e443]:
                  - cell [ref=e444]:
                    - code [ref=e445]: ADMIN
                  - cell [ref=e446]:
                    - code [ref=e447]: /etc/codex/skills
                    - text: Any skills checked into the machine or container in a shared, system location.
                  - cell "Use for SDK scripts, automation, and for checking in default admin skills available to each user on the machine." [ref=e448]
                - row [ref=e449]:
                  - cell [ref=e450]:
                    - code [ref=e451]: SYSTEM
                  - cell "Bundled with Codex by OpenAI." [ref=e452]
                  - cell "Useful skills relevant to a broad audience such as the skill-creator and plan skills. Available to everyone when they start Codex." [ref=e453]
            - paragraph [ref=e454]: Codex supports symlinked skill folders and follows the symlink target when scanning these locations.
            - paragraph [ref=e455]:
              - text: These locations are for authoring and local discovery. When you want to distribute reusable skills beyond a single repo, or optionally bundle them with connectors, use
              - link "plugins" [ref=e456] [cursor=pointer]:
                - /url: https://developers.openai.com/plugins/build/plugins
              - text: .
            - heading "Distribute skills with plugins Copy link to __codexlocalizedvalueprops__codextranslations u0048 distribute skills with plugins" [level=2] [ref=e457]:
              - generic [ref=e458]: Distribute skills with plugins
              - button "Copy link to __codexlocalizedvalueprops__codextranslations u0048 distribute skills with plugins" [ref=e459] [cursor=pointer]
            - paragraph [ref=e462]:
              - text: Direct skill folders are best for local authoring and repo-scoped workflows. If you want to distribute a reusable skill, bundle two or more skills together, or ship a skill alongside a connector, package them as a
              - link "plugin" [ref=e463] [cursor=pointer]:
                - /url: https://developers.openai.com/plugins/build/plugins
              - text: .
            - paragraph [ref=e464]: Plugins can include one or more skills. They can also optionally bundle registered MCP server connections, bundled MCP server configuration, and presentation assets in a single package.
            - heading "Install curated skills for local use Copy link to __codexlocalizedvalueprops__codextranslations u0051 install curated skills for local use" [level=2] [ref=e465]:
              - generic [ref=e466]: Install curated skills for local use
