            - heading "Build skills" [level=1] [ref=e183]
            - paragraph [ref=e184]: Give ChatGPT and Codex new capabilities and expertise
          - article [ref=e185]:
            - paragraph [ref=e186]:
              - text: Use agent skills to extend ChatGPT and Codex with task-specific capabilities. A skill packages instructions, resources, and optional scripts so either product can follow a workflow reliably. Skills build on the
              - link "open agent skills standard" [ref=e187] [cursor=pointer]:
                - /url: https://agentskills.io
              - text: .
            - paragraph [ref=e188]:
              - text: Skills are the authoring format for reusable workflows. Plugins distribute reusable skills and connectors through the universal plugin directory shared by ChatGPT and Codex. Plugins work in Chat and Work across ChatGPT on the web, desktop, and mobile, in Codex in the ChatGPT desktop app, and through Codex CLI. Use skills to design the workflow itself, then package it as a
              - link "plugin" [ref=e189] [cursor=pointer]:
                - /url: https://developers.openai.com/plugins/build/plugins
              - text: when you want other people to install it.
            - paragraph [ref=e190]: Standalone skills are available in the ChatGPT desktop app, Codex CLI, and IDE extension. Skills bundled in plugins are also available in Chat and Work across ChatGPT on the web, desktop, and mobile.
            - paragraph [ref=e191]:
              - text: In the ChatGPT desktop app, open
              - strong [ref=e192]: Skills
              - text: in the sidebar to view and explore skills created across your projects.
            - img "Skills picker showing available skills in the ChatGPT desktop app" [ref=e198]:
