                - button "Copy code to clipboard" [ref=e477] [cursor=pointer]
                - status [ref=e480]
            - paragraph [ref=e481]: You can also prompt the installer to download skills from other repositories. Codex detects newly installed skills automatically; if one doesn't appear, restart Codex.
            - paragraph [ref=e482]: Use this for local setup and experimentation. For reusable distribution of your own skills, prefer plugins.
