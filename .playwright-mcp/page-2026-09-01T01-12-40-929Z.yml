            - paragraph [ref=e279]:
              - text: Skills use
              - strong [ref=e280]: progressive disclosure
              - text: to manage context efficiently. ChatGPT and Codex start with each skill's name and description, then load the full
              - code [ref=e281]: SKILL.md
              - text: instructions when they decide to use that skill.
            - paragraph [ref=e282]: In Codex, the initial list also includes each skill's file path. To avoid crowding out the rest of the prompt, this list uses at most 2% of the model's context window, or 8,000 characters when the context window is unknown. If many skills are installed, Codex shortens skill descriptions first. For large skill sets, Codex may omit some skills from the initial list and show a warning.
            - paragraph [ref=e283]: This budget applies only to the initial skills list. When Codex selects a skill, it still reads the full SKILL.md instructions for that skill.
            - paragraph [ref=e284]:
              - text: A skill is a directory with a
              - code [ref=e285]: SKILL.md
              - text: file plus optional scripts and references. The
              - code [ref=e286]: SKILL.md
              - text: file must include
              - code [ref=e287]: name
              - text: and
              - code [ref=e288]: description
              - text: .
