            - paragraph [ref=e470]:
              - text: To add curated skills beyond the built-ins for your own local Codex setup, use
              - code [ref=e471]: $skill-installer
              - text: . For example, to install the
              - code [ref=e472]: $linear
              - text: "skill:"
            - generic [ref=e473]:
